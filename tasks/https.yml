---
- name: Install certbot and python-certbot-nginx
  apt:
    name: "{{ item }}"
    state: present
    install_recommends: no
  loop:
    - certbot
    - python-certbot-nginx

- name: Add http configuration to retrieve letsencrypt certificate
  include_tasks: http.yml

- name: Reload nginx
  systemd:
    name: nginx
    state: reloaded
  tags: molecule-notest

- name: Get certficate from letsencrypt
  command:
    cmd: /usr/bin/certbot certonly --webroot -w /srv/{{ user_name }}/public_html -m {{ sysadmin_email }} --agree-tos -d {{ domain_name }} -d {{ domain_alias }} -n
    creates: /etc/letsencrypt/live/{{ domain_name }}/fullchain.pem
  tags: molecule-notest

- name: Create Nginx conf (http redirect to https) for website
  template:
    src: templates/etc/nginx/sites-available/https.conf.j2
    dest: /etc/nginx/sites-available/{{ user_name }}.conf
    mode: '0640'
  notify: restart nginx
  tags: molecule-notest

- name: Create symlink for Nginx conf (https)
  file:
    src: /etc/nginx/sites-available/{{ user_name }}.conf
    dest: /etc/nginx/sites-enabled/{{ user_name }}.conf
    state: link
  notify: restart nginx

- name: Add ssl specific configurations
  template:
    src: templates/etc/nginx/snippets/ssl.conf
    dest: /etc/nginx/snippets/ssl.conf
    mode: '0640'
  notify: restart nginx

- name: Edit certbot hook
  template:
    src: templates/etc/letsencrypt/cli.ini
    dest: /etc/letsencrypt/cli.ini
    mode: '0640'
