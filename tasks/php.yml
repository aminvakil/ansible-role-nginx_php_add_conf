---
- name: Remove unnecessary files (default php-fpm conf)
  file:
    path: /etc/php/7.4/fpm/pool.d/www.conf
    state: absent
  notify: restart web services

- name: Create php-fpm conf
  template:
    src: templates/etc/php/7.4/fpm/pool.d/php.conf.j2
    dest: /etc/php/7.4/fpm/pool.d/{{ user_name }}.conf
    mode: 0600
  notify: restart web services
