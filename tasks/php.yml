---
- name: Set php version
  shell:
    cmd: php --version | head -n 1 | awk '{print $2}' | cut -f1,2 -d'.'
  register: php_version
  changed_when: false
  check_mode: false
  tags:
    - skip_ansible_lint

- name: Remove unnecessary files (default php-fpm conf)
  file:
    path: /etc/php/{{ php_version.stdout }}/fpm/pool.d/www.conf
    state: absent
  notify: restart web services

- name: Create php-fpm conf
  template:
    src: templates/etc/php/{{ php_version.stdout }}/fpm/pool.d/php.conf.j2
    dest: /etc/php/{{ php_version.stdout }}/fpm/pool.d/{{ user_name }}.conf
    mode: 0600
  notify: restart web services
