---
- name: Create Nginx conf (http only) for website
  template:
    src: templates/etc/nginx/sites-available/http.conf.j2
    dest: /etc/nginx/sites-available/{{ user_name }}.conf
    mode: '0640'
  notify: restart nginx

- name: Create symlink for Nginx conf (http only)
  file:
    src: /etc/nginx/sites-available/{{ user_name }}.conf
    dest: /etc/nginx/sites-enabled/{{ user_name }}.conf
    state: link
