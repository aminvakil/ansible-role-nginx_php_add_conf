---
name: CI
'on':
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * 1'

defaults:
  run:
    working-directory: 'aminvakil.nginx_php_add_conf'

jobs:

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out the codebase.
        uses: actions/checkout@main
        with:
          path: 'aminvakil.nginx_php_add_conf'

      - name: Set up Python 3.
        uses: actions/setup-python@main
        with:
          python-version: '3.x'

      - name: Install test dependencies.
        run: pip3 install yamllint ansible-lint ansible

      - name: Lint code.
        run: |
          yamllint .
          ansible-lint .

  molecule:
    name: Molecule
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - distro: debian13
            nginx_initial: true
            php_initial: true
            http: true
            https: false
            cloudflare: false
            php: false
          - distro: debian13
            nginx_initial: true
            php_initial: true
            http: false
            https: true
            cloudflare: false
            php: false
          - distro: debian13
            nginx_initial: true
            php_initial: true
            http: false
            https: true
            cloudflare: true
            php: false
          - distro: debian13
            nginx_initial: true
            php_initial: true
            http: true
            https: false
            cloudflare: false
            php: true
          - distro: debian13
            nginx_initial: true
            php_initial: true
            http: false
            https: true
            cloudflare: false
            php: true
          - distro: debian13
            nginx_initial: true
            php_initial: true
            http: false
            https: true
            cloudflare: true
            php: true

    steps:
      - name: Check out the codebase.
        uses: actions/checkout@main
        with:
          path: 'aminvakil.nginx_php_add_conf'

      - name: Set up Python 3.
        uses: actions/setup-python@main
        with:
          python-version: '3.x'

      - name: Install test dependencies.
        run: pip3 install ansible molecule-plugins[docker] docker

      - name: Install needed collections.
        run: ansible-galaxy install -r requirements.yml

      - name: Run Molecule tests.
        run: molecule test
        env:
          PY_COLORS: '1'
          ANSIBLE_FORCE_COLOR: '1'
          MOLECULE_DISTRO: ${{ matrix.distro }}
          NGINX_INITIAL: ${{ matrix.nginx_initial }}
          PHP_INITIAL: ${{ matrix.php_initial }}
          HTTP: ${{ matrix.http }}
          HTTPS: ${{ matrix.https }}
          CLOUDFLARE: ${{ matrix.cloudflare }}
          PHP: ${{ matrix.php }}
